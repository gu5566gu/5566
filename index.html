<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>座標待認領</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef2f5;
    font-family:"Microsoft JhengHei",Arial,sans-serif;
}


.container{

    max-width:700px;
    margin:20px auto;
    padding:20px;

    background:white;
    border-radius:15px;

    box-shadow:0 3px 12px rgba(0,0,0,.15);

}


h1{

    text-align:center;
    font-size:26px;

}


input{

    width:100%;

    padding:12px;

    margin:6px 0;

    border-radius:8px;

    border:1px solid #ccc;

    font-size:16px;

}


button{

    border:0;

    border-radius:8px;

    padding:10px 16px;

    cursor:pointer;

    font-size:15px;

}


.add{

    width:100%;

    background:#2196F3;

    color:white;

    margin-top:10px;

}


.card{

    margin-top:15px;

    padding:15px;

    background:#fafafa;

    border-radius:10px;

    border-left:7px solid #2196F3;

}


.card.claimed{

    border-left-color:#4CAF50;

    background:#f3fff3;

}


.coord{

    color:#1565c0;

    font-weight:bold;

    text-decoration:underline;

    cursor:pointer;

}


.claim{

    background:#4CAF50;

    color:white;

}


.delete{

    background:#f44336;

    color:white;

}


.status{

    color:#2e7d32;

    font-weight:bold;

}


.time{

    color:#777;

    font-size:13px;

}



</style>

</head>


<body>


<div class="container">


<h1>📍 座標待認領</h1>


<input id="publisher" placeholder="發布者">

<input id="name" placeholder="名稱">

<input id="coord" placeholder="座標">

<input id="note" placeholder="備註">


<button class="add" onclick="addItem()">
新增分享
</button>


<div id="list"></div>


</div>



<script>


// ==================================
// 改成你的 GAS Web App 網址
// ==================================

const api = "https://script.google.com/macros/s/AKfycbz71OHorf-9XZECl6HHTT9RA2iaLdnLmQXEi70Aps8ahOPWzCuAikONB2b2K6Q7RBeb/exec";



let data=[];



// 載入資料

async function loadData(){

    try{

        let res = await fetch(api);

        data = await res.json();

        render();

    }

    catch(e){

        console.log(e);

    }

}



// 新增資料

async function addItem(){


    let publisher =
    document.getElementById("publisher").value.trim();


    let name =
    document.getElementById("name").value.trim();


    let coord =
    document.getElementById("coord").value.trim();


    let note =
    document.getElementById("note").value.trim();



    if(!publisher || !name || !coord){

        alert("請輸入發布者、名稱、座標");

        return;

    }



    await fetch(api,{

        method:"POST",

        body:JSON.stringify({

            action:"add",

            publisher,

            name,

            coord,

            note

        })

    });



    document.getElementById("publisher").value="";

    document.getElementById("name").value="";

    document.getElementById("coord").value="";

    document.getElementById("note").value="";



    loadData();


}



// 複製座標

function copyCoord(text){


    navigator.clipboard.writeText(text);


    alert(
        "已複製座標\n\n"+text
    );


}



// 認領

async function claim(id){


    let claimer =
    prompt("請輸入認領者名稱");


    if(!claimer){

        return;

    }



    await fetch(api,{

        method:"POST",

        body:JSON.stringify({

            action:"claim",

            id:id,

            claimer:claimer

        })

    });



    loadData();


}



// 刪除

async function removeItem(id){


    if(!confirm("確定刪除？")){

        return;

    }



    await fetch(api,{

        method:"POST",

        body:JSON.stringify({

            action:"delete",

            id:id

        })

    });



    loadData();


}



// 顯示畫面

function render(){


    let html="";



    if(data.length===0){

        html=
        `
        <p style="text-align:center;color:#888">
        目前沒有資料
        </p>
        `;

    }



    data.forEach(item=>{


        html+=`

        <div class="card ${item.claimed?'claimed':''}">


        <b>發布者：</b>${item.publisher}


        <h3>
        ${item.name}
        </h3>



        📍

        <span class="coord"
        onclick="copyCoord('${item.coord}')">

        ${item.coord}

        </span>



        <p>

        ${item.note || ""}

        </p>



        ${
        item.claimed

        ?

        `

        <div class="status">

        ✔ 已領取<br>

        認領者：${item.claimer}

        </div>


        <br>


        <button class="delete"
        onclick="removeItem(${item.id})">

        🗑 刪除

        </button>


        `


        :


        `

        <button class="claim"

        onclick="claim(${item.id})">

        🙋 我要認領

        </button>


        `

        }


        </div>

        `;


    });



    document.getElementById("list").innerHTML=html;


}



// 啟動

loadData();


// 每5秒同步

setInterval(loadData,5000);



</script>


</body>

</html>
