<script>
  // ⚠️ 請將下方 URL 替換為您部署後獲得的 Web 應用程式網址，並加上 ?type=json
  const API_URL = "https://script.google.com/macros/s/AKfycbytFFflBL7UcnjWoXBYD-gX7AM1orWyRti3LERovK75s5fnbI-w4pwS0XtFlUP2Y1Wc/exec";

  function loadData() {
    document.getElementById('data-list').innerHTML = '<div class="loading">讀取中...</div>';

    // 🌐 使用標準 JavaScript fetch() 呼叫 API
    fetch(API_URL)
      .then(response => {
        if (!response.ok) throw new Error('網路回應異常');
        return response.json();
      })
      .then(data => {
        renderCards(data); // 成功取得 JSON 後渲染卡片
      })
      .catch(error => {
        console.error('API 讀取錯誤:', error);
        document.getElementById('data-list').innerHTML = '<div class="loading" style="color:red;">資料載入失敗，請確認 API 網址設定。</div>';
      });
  }

  function renderCards(data) {
    var container = document.getElementById('data-list');
    if (!data || data.length === 0) {
      container.innerHTML = '<div class="loading">目前尚無任何花田回報。</div>';
      return;
    }

    var html = '';
    data.forEach(function(item) {
      html += `
        <div class="card">
          <div class="card-header">
            <span class="flower-type">🌸 ${escapeHtml(item.flowerType)}</span>
            <span class="farmer-badge">👩‍🌾 ${escapeHtml(item.farmer)}</span>
          </div>
          <div class="info-row">
            <span class="label">⏰ 首花時間：</span>${escapeHtml(item.bloomTime)}
          </div>
          <div class="info-row">
            <span class="label">📍 座標/位置：</span>
            <span>${escapeHtml(item.location)}</span>
            <button class="copy-btn" onclick="copyText('${escapeJs(item.location)}')">複製座標</button>
          </div>
          <div class="info-row">
            <span class="label">📝 備註：</span>${escapeHtml(item.note)}
          </div>
          <div class="time-tag" style="margin-top: 8px; text-align: right;">
            回報時間：${escapeHtml(item.timestamp)}
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('已複製座標/地點：' + text);
    }).catch(err => {
      alert('複製失敗，請手動複製');
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escapeJs(str) {
    return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
  }

  window.onload = loadData;
</script>
